name: Nile checks
on: [push, pull_request]
jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: nile_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:test_only_password@localhost:5432/nile_test
      DATABASE_URL_TEST: postgres://postgres:test_only_password@localhost:5432/nile_test
      SESSION_SECRET: test-only-session-secret-at-least-32-characters
      CSRF_SECRET: test-only-csrf-secret-at-least-32-characters
      GOOGLE_CLIENT_ID: test.apps.googleusercontent.com
      CLIENT_ORIGINS: http://localhost:5173
      TRANSCRIPT_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
