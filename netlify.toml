[build]
  base = "client"
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "24"
  VITE_DATA_MODE = "api"
  VITE_API_BASE_URL = "https://api.saerbridge.com/api/v1"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: https://tile.openstreetmap.org https://*.googleusercontent.com; connect-src 'self' https://api.saerbridge.com https://accounts.google.com; frame-src https://accounts.google.com; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
